# Bundle patch for @dsh-spaces/plugin. Official `dsh plugin add` appends this
# package to dsh.profile.bundles; `dsh plugin remove` drops the layer.
# Profile cordis.patch.yml may overlay this row by id (whole `config` replace).

- insert:
    - id: dsh-spaces
      name: '@dsh-spaces/plugin'
      config: {}
- insert:
    - id: dsh-spaces-main-images
      name: '@dsh-spaces/plugin/llm-images'
      isolate:
        attachments: spaces-main-images
        fs: spaces-main-images
- id: llm-pi-ai
  isolate:
    attachments: spaces-main-images
    fs: spaces-main-images
- id: llm-deepseek
  isolate:
    attachments: spaces-main-images
    fs: spaces-main-images
