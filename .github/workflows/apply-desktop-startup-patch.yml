name: Apply desktop startup patch

on:
  push:
    branches: [fix/desktop-startup-flow]
    paths: ['.github/workflows/apply-desktop-startup-patch.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/desktop-startup-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified text patches
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {
              'core': 'd30a50a1e0f9126e579352b8b32970f45efeea5d45cc358820685774fd0c6c90',
              'ui': '28e2734f157b4dad62a52ec07438b8ee393a0541d145dea7f24deda5aa6dd2ab',
              'clients': '3b0dbe9e37008fcfa7ee2e9bc2e37f696f097e7d3b846f3f3adaa3007e7bd58a',
          }
          for name, digest in expected.items():
              path = pathlib.Path(f'.github/patches/desktop-startup-{name}.patch')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(path, actual)
              assert actual == digest, f'{name}: patch transport checksum mismatch'
          PY
          git apply --check .github/patches/desktop-startup-core.patch .github/patches/desktop-startup-ui.patch .github/patches/desktop-startup-clients.patch
          git apply .github/patches/desktop-startup-core.patch .github/patches/desktop-startup-ui.patch .github/patches/desktop-startup-clients.patch
          git diff --check
          git add README.md package.json scripts src tests tasks/todo.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: open the desktop workbench automatically after verified startup'
          git diff-tree --no-commit-id --name-only -r HEAD | while IFS= read -r path; do printf '%s ' "$path"; git hash-object "$path"; done
          git push origin HEAD:refs/heads/fix/desktop-startup-flow
