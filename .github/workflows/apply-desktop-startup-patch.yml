name: Apply desktop startup patch

on:
  push:
    branches: [fix/desktop-startup-flow]
    paths: ['.github/workflows/apply-desktop-startup-patch.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/desktop-startup-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified patch
        env:
          PATCH_ZLIB_BASE64: 
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB_BASE64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b6fcd066651e66c7ce15f00f06d5fd60f3e107cabf8d29919aa6fad86b6b7528', 'patch transport checksum mismatch'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'desktop-startup.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/desktop-startup.patch"
          git apply "$RUNNER_TEMP/desktop-startup.patch"
          git diff --check
          git add README.md package.json scripts src tests tasks/todo.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: open the desktop workbench automatically after verified startup'
          git push origin HEAD:refs/heads/fix/desktop-startup-flow
