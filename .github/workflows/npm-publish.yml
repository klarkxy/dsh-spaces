name: Publish Spaces to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in all Spaces component manifests
        required: true
        type: string
      tag:
        description: npm distribution channel
        required: true
        default: next
        type: choice
        options: [next, latest]
      publish:
        description: Publish the checked archive to npm (false only prepares a review artifact)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spaces-npm-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'klarkxy/dsh-spaces' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  pack:
    needs: checks
    uses: ./.github/workflows/plugin-distribution.yml
    with:
      version: ${{ inputs.version }}
  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: dsh-spaces-plugin-${{ inputs.version }}
          path: release-artifact
      - name: Verify the exact packed artifact
        run: node scripts/npm-release.mjs check release-artifact/pack-report.json
      - name: Publish once and verify the public archive
        if: inputs.publish
        run: node scripts/npm-release.mjs publish release-artifact/pack-report.json
      - name: Preserve publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}
          path: release-artifact/publication.json
          if-no-files-found: ignore
