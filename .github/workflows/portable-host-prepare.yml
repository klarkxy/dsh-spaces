name: Portable host preparation
on:
  push:
    branches: ['feat/portable-host-spaces-20260925']
    paths: ['.github/workflows/portable-host-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare source and toolchain without Git credentials or user data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portable-host/source /tmp/portable-host/toolchain
          git archive HEAD | tar -x -C /tmp/portable-host/source
          cp -a node_modules /tmp/portable-host/source/
          cp "$(command -v node)" /tmp/portable-host/toolchain/node
          git rev-parse HEAD > /tmp/portable-host/source-commit.txt
          tar -czf /tmp/portable-host-workspace.tgz -C /tmp/portable-host .
      - uses: actions/upload-artifact@v4
        with:
          name: portable-host-workspace
          path: /tmp/portable-host-workspace.tgz
          retention-days: 1
          compression-level: 0
