name: Apply verified portable host source
on:
  push:
    branches: ['feat/portable-host-spaces-20260925']
    paths: ['.github/workflows/portable-host-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'klarkxy/dsh-spaces'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify fixed input, apply source, and push only the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f884af34678dbf9fb2387665f83d5552245e31f0
          test "$(git diff HEAD^ HEAD --name-only)" = .github/workflows/portable-host-apply.yml
          git merge-base --is-ancestor 2891e0eb739dac5265385a5ddc8643e37963a5b6 HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.github/portable-host-patch')
          assert sorted(p.name for p in root.iterdir()) == [f'part{i}' for i in range(1, 6)]
          encoded = ''.join((root / f'part{i}').read_text().strip() for i in range(1, 6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 116068
          assert hashlib.sha256(patch).hexdigest() == '5535248a2b35acef0039a9982e60623f119881e783bb16917a5cc366562df661'
          assert b'diff --git a/.github/' not in patch
          pathlib.Path('/tmp/portable-host.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/portable-host.patch
          git apply --index /tmp/portable-host.patch
          git rm -r .github/portable-host-patch
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name Klarkxy
          git config user.email klarkxy@users.noreply.github.com
          git commit -m 'feat: host-independent Spaces rail with origin-bound contained workbench'
          git push origin HEAD:refs/heads/feat/portable-host-spaces-20260925
