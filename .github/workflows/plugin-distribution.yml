# Manual pack of the prebuilt Spaces plugin for review / directory listing.
# Does not npm publish, does not git tag, does not run electron-builder.
# The plugin tarball is the prebuilt alternative to direct Git-root installation.
name: Plugin distribution pack

on:
  workflow_call:
    inputs:
      version:
        description: Exact version from the GitHub Release
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Explicit dsh-spaces version; must match packages/plugin/package.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack:
    env:
      DSH_SPACES_BUILD_TARGET: distribution
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.10.0"
      - run: node scripts/prepare-ci-environment.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run catalog:check
      - run: pnpm run catalog:verify
      - run: pnpm run typecheck:spaces
      - run: pnpm run build:spaces
      - name: Version must match the dispatch input
        env:
          EXPECTED: ${{ inputs.version }}
        run: node -e "const fs=require('fs'); const expected=process.env.EXPECTED; for (const path of ['package.json','packages/plugin/package.json','packages/supervisor/package.json','packages/view-bridge/package.json','packages/doctor/package.json']) { const pkg=JSON.parse(fs.readFileSync(path,'utf8')); if (pkg.version!==expected) { console.error(path,pkg.version,'!=',expected); process.exit(1) } }"
      - name: Pack preflight
        run: node scripts/pack-spaces-plugin.mjs --preflight
      - name: Pack outside the package trees
        env:
          DSH_PACK_DEST: ${{ runner.temp }}\dsh-spaces-pack
        run: node scripts/pack-spaces-plugin.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-spaces-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/dsh-spaces-pack/*.tgz
            ${{ runner.temp }}/dsh-spaces-pack/pack-report.json
      - name: Package prepared
        run: echo "This job only packs the plugin. The release workflow publishes the checked archive to npm after all checks pass."
