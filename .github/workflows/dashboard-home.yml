name: Dashboard Home
on:
  pull_request:
    paths:
      - 'src/**/dashboard/**'
      - 'src/shared/dashboard*'
      - 'packages/dashboard/**'
      - 'scripts/*dashboard*'
      - 'tests/*dashboard*'
      - 'docs/dashboard/**'
      - '.github/workflows/dashboard-home.yml'
      - 'tsconfig.dashboard*.json'
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing dashboard core baseline
        run: node scripts/test-dashboard-core.mjs
      - name: Preserve reproducible source and compiler fixture (no Home or credentials)
        run: |
          mkdir -p .sandbox/dashboard-home-evidence
          git archive --format=tar HEAD > .sandbox/dashboard-home-evidence/source.tar
          tar -czf .sandbox/dashboard-home-evidence/tooling.tar.gz node_modules/typescript node_modules/tsx node_modules/esbuild node_modules/@esbuild node_modules/@types node_modules/undici-types node_modules/react node_modules/react-dom node_modules/scheduler node_modules/zod node_modules/@deepseek-ai
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-home-source-fixture
          path: .sandbox/dashboard-home-evidence
          retention-days: 1
