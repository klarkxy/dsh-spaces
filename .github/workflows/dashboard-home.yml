name: Dashboard Home
on:
  pull_request:
    paths:
      - 'src/**/dashboard/**'
      - 'src/shared/dashboard*'
      - 'packages/dashboard/**'
      - 'scripts/*dashboard*'
      - 'tests/*dashboard*'
      - 'tests/fixtures/dashboard-home*'
      - 'docs/dashboard/**'
      - '.github/workflows/dashboard-home.yml'
      - 'tsconfig.dashboard*.json'
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-dashboard-core.mjs
      - run: npx --no-install tsc -p tsconfig.dashboard-home.json
      - run: npx --no-install tsc -p tsconfig.dashboard-ui.json
      - name: Local regression and authenticated HTTP
        run: node --import tsx --test tests/dashboard-local.test.ts tests/dashboard-lifetime.test.ts tests/dashboard-view.test.tsx tests/dashboard-http.test.ts
      - name: Home policies, disk, gateway and independent background publishers
        run: node --import tsx --test tests/dashboard-home.test.ts tests/dashboard-home-node.test.ts tests/dashboard-home-gateway.test.ts
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix .sandbox/dashboard-sdk --ignore-scripts --no-audit --no-fund --fetch-retries=0 @deepseek-ai/dsh@0.1.7-alpha.1 pnpm@10.15.0
      - run: node scripts/build-dashboard-plugin.mjs
      - name: Two native DSH Hosts publishing into the isolated Home owner fixture
        env:
          DSH_DASHBOARD_SDK_ROOT: .sandbox/dashboard-sdk
        run: node --import tsx scripts/test-dashboard-home-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-home-native-evidence
          path: .sandbox/dashboard-home-native-evidence
          if-no-files-found: ignore
          retention-days: 7
