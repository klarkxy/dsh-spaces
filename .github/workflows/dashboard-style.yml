name: Dashboard static styles
on:
  pull_request:
    paths:
      - '.github/dashboard-style-edits.json'
      - '.github/workflows/dashboard-style.yml'
      - 'packages/dashboard/src/client-style.ts'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare only six exact reviewed source blobs; never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          allowed={'packages/dashboard/src/client.tsx','packages/dashboard/src/view.tsx','packages/plugin/src/client/index.tsx','packages/plugin/src/workbench/dashboard-home.tsx','scripts/test-dashboard-workbench-native.mjs','tests/dashboard-workbench.test.ts'}
          rows=json.loads(pathlib.Path('.github/dashboard-style-edits.json').read_text())
          assert {r['path'] for r in rows}==allowed and len(rows)==6
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          results=[]
          for row in rows:
              original=pathlib.Path(row['path']).read_bytes();assert sha(original)==row['before']
              text=original.decode()
              for start,end,insert in reversed(row['edits']):
                  assert 0<=start<=end<=len(text)
                  text=text[:start]+insert+text[end:]
              content=text.encode();assert sha(content)==row['after']
              with tempfile.NamedTemporaryFile(mode='w') as file:
                  json.dump({'content':base64.b64encode(content).decode(),'encoding':'base64'},file);file.flush()
                  result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['REPOSITORY']+'/git/blobs','--input',file.name]))
              assert result['sha']==row['after']
              results.append({'path':row['path'],'sha':row['after'],'mode':'100644','type':'blob'})
          print('PREPARED_GIT_BLOBS='+json.dumps(results))
          PY
