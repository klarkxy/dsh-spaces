name: Dashboard local
on:
  pull_request:
    paths:
      - 'src/core/domain/dashboard/**'
      - 'src/shared/dashboard.ts'
      - 'packages/dashboard/**'
      - 'tests/dashboard-*.test.*'
      - 'scripts/probe-dashboard-sdk.mjs'
      - 'scripts/test-dashboard-*.mjs'
      - 'tsconfig.dashboard*.json'
      - '.github/workflows/dashboard-local.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect the actually installed SDK (not acceptance)
        run: node scripts/probe-dashboard-sdk.mjs
