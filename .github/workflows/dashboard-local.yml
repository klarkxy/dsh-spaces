name: Dashboard local
on:
  pull_request:
    paths:
      - 'src/core/domain/dashboard/**'
      - 'src/shared/dashboard.ts'
      - 'packages/dashboard/**'
      - 'tests/dashboard-*.test.*'
      - 'scripts/probe-dashboard-sdk.mjs'
      - 'scripts/test-dashboard-*.mjs'
      - 'tsconfig.dashboard*.json'
      - '.github/workflows/dashboard-local.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile core and retain all previous regression checks
        run: node scripts/test-dashboard-core.mjs
      - name: Local backend behavior
        run: node --import tsx --test tests/dashboard-local.test.ts
      - name: Install pinned official CLI in an isolated SDK fixture
        run: npm install --prefix .sandbox/dashboard-sdk --no-audit --no-fund --ignore-scripts --fetch-retries=0 @deepseek-ai/dsh@0.1.7-alpha.1
      - name: Inspect the installed CLI SDK (not acceptance)
        env:
          DSH_DASHBOARD_SDK_ROOT: .sandbox/dashboard-sdk
        run: node scripts/probe-dashboard-sdk.mjs
