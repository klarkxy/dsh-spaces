name: Dashboard local
on:
  pull_request:
    paths:
      - 'src/core/domain/dashboard/**'
      - 'src/shared/dashboard.ts'
      - 'packages/dashboard/**'
      - 'tests/dashboard-*.test.*'
      - 'tests/fixtures/dashboard-browser.tsx'
      - 'scripts/probe-dashboard-sdk.mjs'
      - 'scripts/test-dashboard-*.mjs'
      - 'tsconfig.dashboard*.json'
      - '.github/workflows/dashboard-local.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile core and retain all previous regression checks
        run: node scripts/test-dashboard-core.mjs
      - name: Typecheck local backend and shared view
        run: npx --no-install tsc -p tsconfig.dashboard-ui.json
      - name: Local backend and shared renderer behavior
        run: node --import tsx --test tests/dashboard-local.test.ts tests/dashboard-lifetime.test.ts tests/dashboard-view.test.tsx
      - name: Install Chromium for the shared view fixture
        run: npx --no-install playwright install --with-deps chromium
      - name: Chromium shared-view interaction (not native DSH installation)
        run: node scripts/test-dashboard-browser.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: .sandbox/dashboard-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned official CLI in an isolated SDK fixture
        run: npm install --prefix .sandbox/dashboard-sdk --no-audit --no-fund --ignore-scripts --fetch-retries=0 @deepseek-ai/dsh@0.1.7-alpha.1
      - name: Inspect actually resolved SDK versions
        env:
          DSH_DASHBOARD_SDK_ROOT: .sandbox/dashboard-sdk
        run: node scripts/probe-dashboard-sdk.mjs
      - name: Real official storage and Cordis checks
        env:
          DSH_DASHBOARD_SDK_ROOT: .sandbox/dashboard-sdk
        run: node --import tsx --test tests/dashboard-sdk.test.ts
