# Push a tag that matches package.json, e.g. v0.1.1
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          node -e "const v=JSON.parse(require('fs').readFileSync('package.json','utf8')).version; const t=process.env.GITHUB_REF_NAME; if (t!=='v'+v) { console.error('tag '+t+' != package.json v'+v); process.exit(1) }"

  gate:
    needs: check-version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check-version, gate]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
