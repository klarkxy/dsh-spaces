name: Dashboard Supervisor
on:
  pull_request:
    paths:
      - 'src/**'
      - 'packages/dashboard/**'
      - 'tests/*dashboard*'
      - 'tests/fixtures/dashboard-supervisor*'
      - 'scripts/*dashboard*'
      - '.github/workflows/dashboard-supervisor.yml'
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install tsc --noEmit -p tsconfig.node.json
      - run: npx --no-install tsc --noEmit -p tsconfig.web.json
      - run: npx --no-install tsc -p tsconfig.dashboard-ui.json
      - run: node scripts/test-dashboard-core.mjs
      - run: node --import tsx --test tests/dashboard-home.test.ts tests/dashboard-home-node.test.ts tests/dashboard-home-gateway.test.ts tests/dashboard-local.test.ts tests/dashboard-lifetime.test.ts tests/dashboard-view.test.tsx tests/dashboard-http.test.ts
      - run: node --import tsx --test tests/dashboard-supervisor.test.ts
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix .sandbox/dashboard-sdk --ignore-scripts --no-audit --no-fund --fetch-retries=0 @deepseek-ai/dsh@0.1.7-alpha.1 pnpm@10.15.0
      - run: node scripts/build-spaces.mjs && node scripts/build-dashboard-plugin.mjs
      - name: Real Supervisor plans, run ownership and two installed DSH Hosts
        env:
          DSH_DASHBOARD_SDK_ROOT: .sandbox/dashboard-sdk
        run: node --import tsx scripts/test-dashboard-supervisor-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-supervisor-native-evidence
          path: .sandbox/dashboard-supervisor-evidence
          if-no-files-found: ignore
          retention-days: 7
