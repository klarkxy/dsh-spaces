name: Dashboard ledger object
on:
  pull_request:
    paths:
      - '.github/dashboard-ledger-prefix.txt'
      - '.github/workflows/dashboard-ledger.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare one exact ledger blob preserving every historical byte; no ref updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          def sha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          original=pathlib.Path('tasks/todo.md').read_bytes()
          assert sha(original)=='b8524ab911a6fb3b450390e94b0ed8e349609e84'
          content=pathlib.Path('.github/dashboard-ledger-prefix.txt').read_bytes()+original
          assert sha(content)=='b35ce32761190a1f77c2f6549524d63d92ab0164'
          with tempfile.NamedTemporaryFile(mode='w') as file:
              json.dump({'content':base64.b64encode(content).decode(),'encoding':'base64'},file);file.flush()
              result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['REPOSITORY']+'/git/blobs','--input',file.name]))
          assert result['sha']==sha(content)
          print('PREPARED_LEDGER_BLOB='+result['sha'])
          PY
