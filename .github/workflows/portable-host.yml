name: Portable host spaces
on:
  pull_request:
    paths:
      - 'packages/plugin/**'
      - 'packages/view-bridge/**'
      - 'src/adapters/node/workbench*'
      - 'src/adapters/node/*/workbench*'
      - 'src/adapters/node/supervisor/**'
      - 'src/adapters/node/maintenance/**'
      - 'src/adapters/node/blueprint/**'
      - 'src/shared/space-host.ts'
      - 'tests/native/portable-host*'
      - 'tests/ui/portable-host-dom*'
      - 'tests/ui/workbench-ui*'
      - 'tests/spaces/spaces-host*'
      - 'tests/server/workbench-http-port*'
      - 'tests/products/workbench-plugin.test.ts'
      - 'tests/fixtures/portable-host/**'
      - 'scripts/verify-plugin-standard-install.mjs'
      - '.github/workflows/portable-host.yml'
permissions:
  contents: read
jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '26.10.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run build:blueprint
      - run: npm run typecheck:spaces && npm run typecheck
      - run: node --import tsx --test tests/native/portable-host.test.ts tests/products/workbench-plugin.test.ts tests/spaces/spaces-host.test.ts tests/ui/workbench-ui.test.tsx tests/server/workbench-http-port.test.ts
