name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:spaces
      - run: npm test
      - run: npm run test:spaces
      - run: npm run test:llm
      - run: npm run test:workbench
      - run: npm run test:workbench:recovery
      - run: npm run build:spaces
      - name: Install official DSH CLI (latest)
        run: |
          pnpm --version
          npm install -g @deepseek-ai/dsh@latest
          dsh --version
      - name: Official CLI integration check
        shell: pwsh
        run: |
          $bin = Join-Path ((npm root -g).Trim()) "@deepseek-ai/dsh/lib/bin.js"
          $env:DSH_TEST_CLI_BIN = $bin
          node --import tsx --test tests/compatible-dsh-cli.test.ts
      - name: Pack preflight
        run: node scripts/pack-spaces-plugin.mjs --preflight
      - name: Standard-install static evidence
        env:
          DSH_TEST_OUTPUT: ${{ runner.temp }}/plugin-standard-install
        run: node scripts/verify-plugin-standard-install.mjs --preflight
      - name: Setup sandbox profiles
        run: node scripts/setup-sandbox.mjs "${{ runner.temp }}/dsh-home"
      - name: Isolation gate
        run: node scripts/validate-isolation.mjs --home "${{ runner.temp }}/dsh-home" --clean
      - name: Lifecycle A3/A9 gate
        run: node scripts/verify-lifecycle.mjs --home "${{ runner.temp }}/dsh-home"
      - name: A8 row-id gate
        env:
          DSH_SPACES_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/verify-a8.mjs

  plugin-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:spaces
      - run: npx playwright install chromium
      - name: Install official latest CLI and package manager for acceptance
        run: npm install --prefix "${{ runner.temp }}/plugin-tools" @deepseek-ai/dsh@latest pnpm@10.29.2 --no-audit --no-fund
      - name: Standard plugin installation in a fresh Home
        env:
          DSH_TEST_BIN: ${{ runner.temp }}/plugin-tools/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_TEST_PNPM_CJS: ${{ runner.temp }}/plugin-tools/node_modules/pnpm/bin/pnpm.cjs
          DSH_TEST_OUTPUT: ${{ runner.temp }}/plugin-install-latest
          DSH_PACK_DEST: ${{ runner.temp }}/plugin-pack-latest
        run: npm run validate:plugin-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-install-latest
          path: |
            ${{ runner.temp }}/plugin-install-latest/*.json
            ${{ runner.temp }}/plugin-install-latest/*.log
            ${{ runner.temp }}/plugin-install-latest/*.png
