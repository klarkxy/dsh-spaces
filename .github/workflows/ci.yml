name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.29.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:spaces
      - run: npm test
      - run: npm run test:spaces
      - run: npm run test:workbench
      - run: npm run test:workbench:recovery
      - run: npm run build:spaces
      - name: Install DSH CLI 0.1.5-rc.1 (latest) and 0.1.5-rc.2 (next)
        run: |
          pnpm --version
          npm install -g @deepseek-ai/dsh@0.1.5-rc.1
          npm install --prefix "${{ runner.temp }}/dsh-next" @deepseek-ai/dsh@0.1.5-rc.2
          dsh --version
          node "${{ runner.temp }}/dsh-next/node_modules/@deepseek-ai/dsh/lib/bin.js" --version
      - name: Official CLI integration check
        env:
          DSH_TEST_RC2_BIN: ${{ runner.temp }}/dsh-next/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: node --import tsx --test tests/compatible-dsh-cli.test.ts
      - name: Pack preflight
        run: node scripts/pack-spaces-plugin.mjs --preflight
      - name: Standard-install static evidence
        env:
          DSH_TEST_RC2_BIN: ${{ runner.temp }}/dsh-next/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_TEST_OUTPUT: ${{ runner.temp }}/plugin-standard-install
        run: node scripts/verify-plugin-standard-install.mjs --preflight
      - name: Setup sandbox profiles
        run: node scripts/setup-sandbox.mjs "${{ runner.temp }}/dsh-home"
      - name: Isolation gate
        run: node scripts/validate-isolation.mjs --home "${{ runner.temp }}/dsh-home" --clean
      - name: Lifecycle A3/A9 gate
        run: node scripts/verify-lifecycle.mjs --home "${{ runner.temp }}/dsh-home"
      - name: A8 row-id gate
        env:
          DSH_SPACES_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/verify-a8.mjs

  plugin-install:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cli: ["0.1.5-rc.1", "0.1.5-rc.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:spaces
      - run: npx playwright install chromium
      - name: Install exact CLI and package manager for acceptance
        run: npm install --prefix "${{ runner.temp }}/plugin-tools" @deepseek-ai/dsh@${{ matrix.cli }} pnpm@10.29.2 --no-audit --no-fund
      - name: Standard plugin installation in a fresh Home
        env:
          DSH_TEST_BIN: ${{ runner.temp }}/plugin-tools/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_TEST_PNPM_CJS: ${{ runner.temp }}/plugin-tools/node_modules/pnpm/bin/pnpm.cjs
          DSH_TEST_OUTPUT: ${{ runner.temp }}/plugin-install-${{ matrix.cli }}
          DSH_PACK_DEST: ${{ runner.temp }}/plugin-pack-${{ matrix.cli }}
        run: npm run validate:plugin-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-install-${{ matrix.cli }}
          path: |
            ${{ runner.temp }}/plugin-install-${{ matrix.cli }}/*.json
            ${{ runner.temp }}/plugin-install-${{ matrix.cli }}/*.log
            ${{ runner.temp }}/plugin-install-${{ matrix.cli }}/*.png
