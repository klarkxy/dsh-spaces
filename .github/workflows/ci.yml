name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install DSH CLI
        run: |
          pnpm --version
          npm install -g @deepseek-ai/dsh@0.1.1-rc.2
          dsh --version
      - name: Setup sandbox profiles
        run: node scripts/setup-sandbox.mjs
      - name: Isolation gate
        run: npm run validate:isolation
      - name: Lifecycle A3/A9 gate
        run: npm run validate:lifecycle
      - name: A8 row-id gate
        run: npm run validate:a8
