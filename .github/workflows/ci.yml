name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install DSH CLI
        run: |
          pnpm --version
          npm install -g @deepseek-ai/dsh@0.1.1-rc.2
          dsh --version
      - name: Setup sandbox profiles
        run: node scripts/setup-sandbox.mjs "${{ runner.temp }}/dsh-home"
      - name: Isolation gate
        run: node scripts/validate-isolation.mjs --home "${{ runner.temp }}/dsh-home" --clean
      - name: Lifecycle A3/A9 gate
        run: node scripts/verify-lifecycle.mjs --home "${{ runner.temp }}/dsh-home"
      - name: A8 row-id gate
        env:
          DSH_SPACES_HOME: ${{ runner.temp }}/dsh-home
        run: node scripts/verify-a8.mjs
