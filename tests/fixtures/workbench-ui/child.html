<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>child</title>
  </head>
  <body>
    <textarea id="draft" data-draft="true"></textarea>
    <script>
      const spaceId = location.pathname.replace(/^\//, "") || "alpha";
      const generation = 1;
      const channel = "ch-" + spaceId + "-" + generation;
      const serviceEpoch = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";
      function notify(state) {
        window.parent.postMessage(
          {
            source: "dsh-spaces-view",
            serviceEpoch: serviceEpoch,
            spaceId: spaceId,
            generation: generation,
            channel: channel,
            state: state,
          },
          "*",
        );
      }
      notify("ready");
      window.addEventListener("load", function () {
        notify("ready");
      });
    </script>
  </body>
</html>
